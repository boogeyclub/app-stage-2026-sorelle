spring.application.name=service-connectmarket

# Optionally loads local PostgreSQL settings from .env when the service is run from this directory.
spring.config.import=optional:file:.env[.properties]

# Connects to the PostgreSQL server already running on the local computer by default.
# Environment variables or a local .env file override these configured defaults.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:6000}/${POSTGRES_DB:cacaomarketcm}
spring.datasource.username=${POSTGRES_USER:sorelle}
spring.datasource.password=${POSTGRES_PASSWORD:root1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=cacaomarketcm-pool

# SMTP settings are intentionally sourced from environment variables or the untracked local .env file.
# Registration requests fail safely and roll back when mail delivery is not configured or cannot be completed.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Registration confirmation links are accepted by the backend confirmation endpoint and expire after three hours.
app.registration.confirmation-url=${REGISTRATION_CONFIRMATION_URL:http://localhost:8080/api/auth/registration/confirm}
app.registration.mail-from=${REGISTRATION_MAIL_FROM:no-reply@cacaomarket.local}
app.registration.cleanup-interval=${REGISTRATION_CLEANUP_INTERVAL:PT1M}

# The Angular development server proxies /api requests to this service, so browser code always uses a relative /api URL.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
