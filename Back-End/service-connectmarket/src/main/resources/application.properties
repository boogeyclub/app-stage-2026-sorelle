spring.application.name=service-connectmarket

# Loads local PostgreSQL settings from .env when the service is run from this directory.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection. Environment variables or a local .env file override these local-development defaults.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:connectmarket}
spring.datasource.username=${POSTGRES_USER:connectmarket}
spring.datasource.password=${POSTGRES_PASSWORD:connectmarket_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=connectmarket-pool
