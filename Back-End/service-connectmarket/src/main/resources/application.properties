spring.application.name=service-connectmarket

# Orderly API audit logs are emitted to the IntelliJ/console output and to this local log file.
# The request ID ties every log line generated for one API call together.
logging.level.cm.odigital.serviceconnectmarket=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId}] %logger{48} - %msg%n
logging.file.name=${APP_LOG_FILE:logs/cacaomarket-api.log}
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId}] %logger{48} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14

# Load the ignored local .env when IntelliJ runs with Back-End as its working directory,
# as well as when Spring is launched from the service module directory.
spring.config.import=optional:file:service-connectmarket/src/main/resources/.env[.properties],optional:file:service-connectmarket/.env[.properties],optional:file:src/main/resources/.env[.properties],optional:file:.env[.properties]

# Connects to the PostgreSQL server already running on the local computer by default.
# Environment variables or a local .env file override these configured defaults.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:6000}/${POSTGRES_DB:cacaomarketcm}
spring.datasource.username=${POSTGRES_USER:sorelle}
spring.datasource.password=${POSTGRES_PASSWORD:root1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=cacaomarketcm-pool

# Gmail SMTP settings are intentionally sourced from environment variables or the untracked local .env file.
# Use a Google App Password for MAIL_PASSWORD, never the normal Google account password.
# Registration requests fail safely and roll back when mail delivery is not configured or cannot be completed.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# Registration confirmation links open the Angular workflow, which securely sends the token to the backend API.
# Configure this to the public frontend URL in every deployed environment.
app.registration.confirmation-url=${REGISTRATION_CONFIRMATION_URL:http://localhost:4200/CacaoMarket/registration/confirm}
# Gmail normally only permits the configured mailbox or a verified alias as the sender.
# If left blank, the configured MAIL_USERNAME is used as the sender.
app.registration.mail-from=${REGISTRATION_MAIL_FROM:}
app.registration.cleanup-interval=${REGISTRATION_CLEANUP_INTERVAL:PT1M}

# Expired browser-session records are invalidated regularly while their safe history is retained.
app.session.cleanup-interval=${SESSION_CLEANUP_INTERVAL:PT5M}

# The Angular development app calls this service directly; allow its origin for credentialed API requests.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
