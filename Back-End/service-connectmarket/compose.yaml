services:
  postgres:
    image: postgres:17-alpine
    container_name: connectmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connectmarket}
      POSTGRES_USER: ${POSTGRES_USER:-connectmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectmarket_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - connectmarket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  connectmarket-postgres-data:
